<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>SolidOS</title>
    <!-- No build: the importmap, then mashlib as a module. Upstream's webpack injects
         mashlib.min.js here and calls panes.runDataBrowser() on DOMContentLoaded; our
         modules await their stylesheets, so the module calls it once loaded instead.
         ?uri= picks the subject (default: this page's URL, as upstream). -->
    <script src="manifest.js"></script>
    <script src="../src/importmap.js"></script>
    <script type="module">
      await import('./mashlib.js')

      const uri = new URL(location.href).searchParams.get('uri')

      panes.runDataBrowser(uri ?? undefined)

      // The profile heading (name and photo above a profile, from solid-panes 5.1.0) is drawn
      // for the page's own address. With ?uri= the thing on show is another address, so once
      // the first view is up, point the heading at it.
      if (uri) {
        document.addEventListener('solid-panes:navigated', () => {
          panes.initializeProfileHeading(() => uri)
          panes.refreshProfileHeading(true).catch(error => console.error('Failed to show the profile heading.', error))
        }, { once: true })
      }

      var header = document.getElementById('mainSolidUiHeader')

      if (header) {
        var syncHeaderHeight = function () {
          var height = header.getBoundingClientRect().height
          if (height > 0) {
            var rootFontSize = parseFloat(
              getComputedStyle(document.documentElement).fontSize
            )
            document.documentElement.style.setProperty(
              '--app-header-height',
              (height / rootFontSize) + 'rem'
            )
          }
        }

        syncHeaderHeight()
        if ('ResizeObserver' in window) {
          new ResizeObserver(syncHeaderHeight).observe(header)
        } else {
          window.addEventListener('resize', syncHeaderHeight)
        }
      }
    </script>
  </head>
  <body id="PageBody" data-app-shell="databrowser">
    <solid-ui-provider>
        <!-- Skip-navigation link (accessibility) -->
        <a href="#MainContent" class="skip-link">Skip to main content</a>

        <!--  Header — populated by solid-panes createHeader(), plus responsive menu toggle -->

        <!-- Main content area — single visible region at a time -->
        <div class="app-main" tabindex="-1" aria-live="polite">
        <div class="app-shell">

            <main id="MainContent" class="app-view">
            <!--
                Outline view: the primary RDF-subject browser.
                JS appends property-table <div>s (not <tr>s) here.
            -->
            <div
                id="OutlineView"
                class="outline-view"
                aria-label="Resource browser"
            >
            <!--
                solid-panes navbar and pane content are injected here by
                OutlineManager.GotoSubject / propertyTable / outlineExpand.
                Each subject block is a <article class="subject-block">.
            -->
            </div>

            </main> <!-- .app-view -->
        </div> <!-- .app-shell -->

    </solid-ui-provider>
  </body>
</html>
