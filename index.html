<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mashlib dynamic</title>
  <meta name="description" content="SolidOS 3.1 as plain ES modules: the data browser and its panes, loaded from URLs with no build.">
  <script>
    // This address is the data browser. ?uri=<resource> says what to show; with none, a
    // public profile on the SolidOS test pod.
    var uri = new URL(location.href).searchParams.get('uri') || 'https://testingsolidos.solidcommunity.net/profile/card#me'
    location.replace('mashlib/databrowser.html?uri=' + encodeURIComponent(uri))
  </script>
</head>
<body>
  <p><a href="mashlib/databrowser.html?uri=https%3A%2F%2Ftestingsolidos.solidcommunity.net%2Fprofile%2Fcard%23me">Open the data browser</a> · <a href="gallery.html">component gallery</a></p>
</body>
</html>
